<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思い出カメラ｜撮影スポットを選ぶ</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Klee One', cursive;
            font-weight: 600;
            background: linear-gradient(180deg, #fff0f6, #ffe4ec);
            color: #e2558f;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== 桜の背景 ===== */
        .spring-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
        .sakura {
            position: absolute;
            top: -10%;
            width: 14px;
            height: 18px;
            background: radial-gradient(circle at 50% 30%, #ffd6e5 0%, #ff9fbd 45%, #ff6fa5 80%);
            border-radius: 60% 60% 70% 70% / 55% 55% 90% 90%;
            opacity: 0.85;
            animation: sakura-fall linear infinite, sakura-sway ease-in-out infinite;
        }
        @keyframes sakura-fall {
            0%   { transform: translateY(-10%) rotate(0deg);   opacity: 0; }
            10%  { opacity: 1; }
            100% { transform: translateY(120vh) rotate(240deg); opacity: 0; }
        }
        @keyframes sakura-sway {
            0%   { margin-left: 0; }
            25%  { margin-left: -12px; }
            50%  { margin-left: 8px; }
            75%  { margin-left: -6px; }
            100% { margin-left: 0; }
        }

        /* ===== スマホ幅コンテナ ===== */
        .wrap {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 28px 16px 48px;
        }

        /* ===== ヘッダー ===== */
        .page-header {
            text-align: center;
            margin-bottom: 22px;
        }
        .page-title {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.1em;
            background: linear-gradient(135deg, #FF46BB 0%, #ff7aa8 45%, #ff9fc5 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0 0 6px;
        }
        .page-sub {
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #b88a9f;
            letter-spacing: 0.06em;
            margin: 0;
        }

        /* ===== 2列グリッド ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        /* ===== カード ===== */
        .card {
            display: block;
            text-decoration: none;
            border-radius: 18px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 8px 20px rgba(255, 120, 160, 0.22);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }
        .card:active {
            transform: scale(0.96);
            box-shadow: 0 4px 12px rgba(255, 120, 160, 0.3);
        }

        .card-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 3 / 4;   /* 撮影後の写真と同じ比率 */
            background: #ffeaf2;
            overflow: hidden;
        }
        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 下側に薄いグラデをかけて文字を読みやすく */
        .card-thumb::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0) 55%, rgba(255,120,168,0.55) 100%);
        }

        /* 角のかざり（アプリの撮影枠と合わせる） */
        .corner {
            position: absolute;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.9);
            z-index: 2;
        }
        .corner.tl { top: 8px;    left: 8px;    border-right: none; border-bottom: none; border-top-left-radius: 5px; }
        .corner.tr { top: 8px;    right: 8px;   border-left: none;  border-bottom: none; border-top-right-radius: 5px; }
        .corner.bl { bottom: 8px; left: 8px;    border-right: none; border-top: none;    border-bottom-left-radius: 5px; }
        .corner.br { bottom: 8px; right: 8px;   border-left: none;  border-top: none;    border-bottom-right-radius: 5px; }

        /* 場所名（画像下に重ねる） */
        .card-place {
            position: absolute;
            left: 10px;
            right: 10px;
            bottom: 10px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 5px;
            color: #fff;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.03em;
            text-shadow: 0 1px 4px rgba(214, 64, 130, 0.7);
            line-height: 1.3;
        }
        .card-place svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* 全身/バストのバッジ */
        .badge {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 3;
            padding: 3px 9px;
            border-radius: 999px;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: #ff5b95;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 2px 6px rgba(255, 120, 160, 0.35);
        }

        /* 画像が無いときのプレースホルダ */
        .card-thumb img.broken {
            opacity: 0;
        }
        .thumb-fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 12px;
            color: #d98cab;
            background: repeating-linear-gradient(45deg, #ffeaf2, #ffeaf2 10px, #ffe0ec 10px, #ffe0ec 20px);
        }

        .footer-note {
            margin-top: 26px;
            text-align: center;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: #c2aab4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
    </style>
</head>
<body>

<!-- 桜背景（JSで花びらを生成） -->
<div class="spring-bg" id="spring-bg"></div>

<div class="wrap">
    <header class="page-header">
        <h1 class="page-title">撮影スポットを選ぶ</h1>
        <p class="page-sub">行きたい場所をタップしてね 🌸</p>
    </header>

    <div class="grid" id="grid"></div>

    <p class="footer-note">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14">
            <g fill="none" stroke="#ffb6c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M 8 11 V 8 A 4 4 0 0 1 16 8 V 11" />
                <rect x="5" y="11" width="14" height="10" rx="1.5" />
                <path d="M 12 14 V 17" />
            </g>
        </svg>
        写真は端末内のみに保存されます
    </p>
</div>

<script>
    // ===== カメラ本体のページ名（必要なら書き換えてください） =====
    const CAMERA_PAGE = "camera.html";

    // ===== 撮影スポット一覧（app.js の PRESETS と同じ並び） =====
    // mode: "bust" = 肩から上 / "full" = 全身
    const PLACES = [
        { key: "ohori-miti",       place: "お堀の桜道",         image: "images/mihon/ohori_miti.png",      mode: "full" },
        { key: "siro-sakura",      place: "岸和田城と桜",       image: "images/mihon/siro_sakura.png",     mode: "full" },
        { key: "siro",             place: "岸和田城",           image: "images/mihon/siro.png",            mode: "full" },
        { key: "undojo",           place: "グラウンド前",       image: "images/mihon/undojo.png",          mode: "full" },
        { key: "wakimiti",         place: "神社前の通学路",     image: "images/mihon/wakimiti.png",        mode: "full" },
        { key: "eki",              place: "蛸地蔵駅",           image: "images/mihon/eki.png",             mode: "full" },
        { key: "jinja",            place: "岸城神社",           image: "images/mihon/jinja.png",           mode: "full" },
        { key: "koen",             place: "二の丸広場",         image: "images/mihon/koen.png",            mode: "full" },
        { key: "koen-mae",         place: "二の丸広場前",       image: "images/mihon/koen_mae.png",        mode: "full" },
        { key: "komon",            place: "岸和田高校正門",     image: "images/mihon/komon.png",           mode: "full" },
        { key: "kosya-yoko",       place: "岸和田高校校舎",     image: "images/mihon/kosya_yoko.png",      mode: "full" },
        { key: "kosya",            place: "岸和田高校体育館",   image: "images/mihon/kosya.png",           mode: "full" },
        { key: "siro-neta",        place: "岸和田城のてっぺん", image: "images/mihon/siro_ue.png",         mode: "full" },
    ];
　
    // ピンのSVG
    const pinSvg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
            <path d="M16 28s8-6.5 8-13a8 8 0 1 0-16 0c0 6.5 8 13 8 13z" fill="#fff"/>
            <circle cx="16" cy="15" r="2.6" fill="#ff7aa8"/>
        </svg>`;

    // ===== カードを生成 =====
    const grid = document.getElementById("grid");

    PLACES.forEach(p => {
        const a = document.createElement("a");
        a.className = "card";
        a.href = `${CAMERA_PAGE}?bg=${encodeURIComponent(p.key)}`;

        const badge = p.mode === "full" ? "全身" : "顔・肩";

        a.innerHTML = `
            <div class="card-thumb">
                <img src="${p.image}" alt="${p.place}" loading="lazy"
                     onerror="this.classList.add('broken'); this.nextElementSibling.style.display='flex';">
                <div class="thumb-fallback">画像を準備中</div>
                <span class="corner tl"></span>
                <span class="corner tr"></span>
                <span class="corner bl"></span>
                <span class="corner br"></span>
                <div class="card-place">${pinSvg}<span>${p.place}</span></div>
            </div>
        `;
        grid.appendChild(a);
    });

    // ===== 桜の花びらを散らす =====
    (function makeSakura() {
        const bg = document.getElementById("spring-bg");
        const count = 14;
        for (let i = 0; i < count; i++) {
            const s = document.createElement("div");
            s.className = "sakura";
            s.style.left = Math.random() * 100 + "%";
            s.style.animationDuration =
                (12 + Math.random() * 16) + "s, " + (3 + Math.random() * 3) + "s";
            s.style.animationDelay =
                (-Math.random() * 30) + "s, " + (-Math.random() * 5) + "s";
            const scale = 0.6 + Math.random() * 0.8;
            s.style.transform = `scale(${scale})`;
            bg.appendChild(s);
        }
    })();
</script>

</body>
</html>
