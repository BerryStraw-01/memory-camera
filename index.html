<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>思い出カメラ</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- カメラ画面 -->
<div id="camera-screen" class="screen active">
    <video
            id="camera-video"
            muted
            playsinline
    ></video>

    <button id="shutter-btn" class="main-btn">
        📸 カメラを起動
    </button>
</div>

<!-- プレビュー画面 -->
<div id="preview-screen" class="screen">
    <div class="preview-area">
        <img id="captured-image" alt="合成結果">
    </div>

    <div class="controls">
        <label>
            上下
            <input type="range" id="offset-slider" min="-20" max="20" value="0">
        </label>
        <label>
            サイズ
            <input type="range" id="scale-slider" min="70" max="90" value="80">
        </label>
    </div>

    <button id="retry-btn">撮り直す</button>
</div>

<!-- 非表示Canvas -->
<canvas id="capture-canvas" style="display:none;"></canvas>

<!-- MediaPipe（※ 必ず script タグ） -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<!-- App -->
<script src="app.js"></script>
</body>
</html>
